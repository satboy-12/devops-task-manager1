name: Nexora AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Production Application
        run: npm run build

      - name: Validate Production Build Artifacts
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "Error: Production build directory or index.html missing!"
            exit 1
          fi
          echo "Build verification passed: dist/ generated successfully."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        run: |
          docker build -t nexora-ai-devops-manager:${{ github.sha }} .

      - name: Test Container Health & Web Server
        run: |
          docker run -d --name test-app -p 8080:80 nexora-ai-devops-manager:${{ github.sha }}
          sleep 4
          docker ps
          curl --fail --retry 3 --retry-delay 2 http://localhost:8080/ || (docker logs test-app && exit 1)
          docker stop test-app
